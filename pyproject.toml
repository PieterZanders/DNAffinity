[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dnaffinity"
version = "1.0.0"
description = "Physics-based machine learning prediction of transcription factor DNA binding affinities"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
]

[project.optional-dependencies]
dfn = ["torch"]
dev = ["pytest>=7"]
test = ["pytest>=7", "torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["dnaffinity*"]
